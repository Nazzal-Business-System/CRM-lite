name: Production database backup

on:
  schedule:
    - cron: "0 2 * * *"
      timezone: "Asia/Amman"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Create encrypted PostgreSQL backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Provision the public recipient before publishing this workflow change.
      # A missing/invalid recipient fails closed; there is no plaintext fallback.
      - name: Check public recipient configuration
        shell: bash
        env:
          BACKUP_AGE_RECIPIENT: ${{ vars.CRM_BACKUP_AGE_RECIPIENT }}
        run: |
          set +x
          set -Eeuo pipefail
          if [[ ! "${BACKUP_AGE_RECIPIENT:-}" =~ ^age1[0-9a-z]+$ ]]; then
            echo "::error::Configure CRM_BACKUP_AGE_RECIPIENT with the offline custodian's age public recipient before activation."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build backup tools (no secrets in build)
        run: docker build --pull --tag crm-backup-tools .github/backup

      - name: Create, validate and encrypt custom-format dump
        id: backup
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.CRM_BACKUP_AGE_RECIPIENT }}
          BACKUP_EXPECTED_DATABASE: neondb
          BACKUP_EXPECTED_NEON_PROJECT: divine-bread-20243849
          BACKUP_EXPECTED_NEON_BRANCH: br-calm-fire-axiwyf0s
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          backup_name="crm-postgres-$(date -u +'%Y%m%dT%H%M%SZ').dump.age"
          output_dir="${RUNNER_TEMP:?}/crm-encrypted-backup"
          mkdir -m 700 "$output_dir"
          docker run --rm --user "$(id -u):$(id -g)" \
            --tmpfs /work:rw,noexec,nosuid,nodev,size=512m,mode=1777 \
            -e DATABASE_URL -e BACKUP_AGE_RECIPIENT \
            -e BACKUP_EXPECTED_DATABASE -e BACKUP_EXPECTED_NEON_PROJECT -e BACKUP_EXPECTED_NEON_BRANCH \
            -e BACKUP_NAME="$backup_name" \
            -v "$output_dir:/encrypted" crm-backup-tools
          test -s "$output_dir/$backup_name"
          echo "backup_name=$backup_name" >> "$GITHUB_OUTPUT"
          echo "backup_file=$output_dir/$backup_name" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup artifact
        if: ${{ success() && steps.backup.outputs.backup_file != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.backup_name }}
          path: ${{ steps.backup.outputs.backup_file }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove runner encrypted output
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- "${RUNNER_TEMP:?}/crm-encrypted-backup"
